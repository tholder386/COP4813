<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> assignment 9: Canvas Animation</title>
  <style>
    :root {
      --bg-color: #0f111a;
      --card-bg: #1a1d2e;
      --accent-purple: #7c4dff;
      --accent-cyan: #00e5ff;
      --text-main: #e0e6ed;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .container {
      background-color: var(--card-bg);
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(124, 77, 255, 0.2);
      text-align: center;
    }

    h1 {
      margin-top: 0;
      color: var(--accent-cyan);
      font-size: 1.8rem;
    }

    p {
      color: #94a3b8;
      font-size: 0.95rem;
      margin-bottom: 20px;
    }

    canvas {
      background-color: #05060a;
      border: 2px solid var(--accent-purple);
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(124, 77, 255, 0.3);
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Canvas Interactive Bounce &amp; Explosion</h1>
    <p>Click the bouncing orb to trigger a particle explosion and directional shockwave!</p>
    <canvas id="animCanvas" width="600" height="400"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('animCanvas');
    const ctx = canvas.getContext('2d');

    // Bouncing Ball Object (Part 1)
    const ball = {
      x: 50,
      y: 50,
      radius: 20,
      dx: 4, // Horizontal velocity
      dy: 4, // Vertical velocity (45-degree movement when dx == dy)
      color: '#00e5ff',
      glowColor: 'rgba(0, 229, 255, 0.6)'
    };

    // Array to manage active particle effects (Part 2)
    let particles = [];

    // Particle constructor for the click explosion
    class Particle {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.radius = Math.random() * 4 + 2;
        // Random explosion trajectories
        this.dx = (Math.random() - 0.5) * 10;
        this.dy = (Math.random() - 0.5) * 10;
        this.color = `hsl(${Math.random() * 60 + 260}, 100%, 65%)`; // Purple/pink palette
        this.alpha = 1;
        this.decay = Math.random() * 0.03 + 0.015;
      }

      draw() {
        ctx.save();
        ctx.globalAlpha = this.alpha;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.shadowBlur = 10;
        ctx.shadowColor = this.color;
        ctx.fill();
        ctx.restore();
      }

      update() {
        this.x += this.dx;
        this.y += this.dy;
        this.alpha -= this.decay;
      }
    }

    // Main animation loop
    function animate() {
      // Clear frame with slight opacity for motion blur trail
      ctx.fillStyle = 'rgba(5, 6, 10, 0.3)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // --- Part 1: Movement & Bounded Wall Collision ---
      ball.x += ball.dx;
      ball.y += ball.dy;

      // Bounce off horizontal walls (Left / Right)
      if (ball.x + ball.radius > canvas.width || ball.x - ball.radius < 0) {
        ball.dx *= -1; // Reverse horizontal direction
      }

      // Bounce off vertical walls (Top / Bottom)
      if (ball.y + ball.radius > canvas.height || ball.y - ball.radius < 0) {
        ball.dy *= -1; // Reverse vertical direction
      }

      // Draw Main Object
      ctx.save();
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
      ctx.fillStyle = ball.color;
      ctx.shadowBlur = 15;
      ctx.shadowColor = ball.glowColor;
      ctx.fill();
      ctx.closePath();
      ctx.restore();

      // --- Part 2: Render & Update Particle Explosion Effects ---
      for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        particles[i].draw();

        // Remove faded particles
        if (particles[i].alpha <= 0) {
          particles.splice(i, 1);
        }
      }

      requestAnimationFrame(animate);
    }

    // --- Part 2: Interactive Mouse Click Handling ---
    canvas.addEventListener('click', (e) => {
      const rect = canvas.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      const mouseY = e.clientY - rect.top;

      // Calculate distance between mouse click and ball center
      const distance = Math.hypot(mouseX - ball.x, mouseY - ball.y);

      // Check if click occurred inside the ball boundary
      if (distance <= ball.radius) {
        // 1. Trigger explosion burst of 30 particles
        for (let i = 0; i < 30; i++) {
          particles.push(new Particle(ball.x, ball.y));
        }

        // 2. Change velocity/direction randomly on impact
        ball.dx = (Math.random() > 0.5 ? 1 : -1) * (Math.random() * 3 + 3);
        ball.dy = (Math.random() > 0.5 ? 1 : -1) * (Math.random() * 3 + 3);

        // 3. Shift color theme on hit
        const randomHue = Math.floor(Math.random() * 360);
        ball.color = `hsl(${randomHue}, 100%, 60%)`;
        ball.glowColor = `hsl(${randomHue}, 100%, 75%)`;
      }
    });

    // Start animation loop
    animate();
  </script>

</body>
</html>
