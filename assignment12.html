<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assignment 12: Content Management Systems | Trevon L Holder</title>
  <link rel="stylesheet" href="style.css">
  <style>
    :root {
      --bg-dark: #120b1e;
      --bg-card: #1d1230;
      --bg-header: #2c184a;
      --accent-purple: #9d4edd;
      --accent-glow: #c77dff;
      --text-main: #f3e8ff;
      --text-muted: #cbb2fe;
      --border-color: #3c2363;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
      line-height: 1.6;
    }

    .container {
      max-width: 1250px;
      margin: 2rem auto;
      padding: 0 1.5rem;
    }

    header.page-header {
      background: linear-gradient(135deg, #240046, #3c096c);
      padding: 2rem;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      margin-bottom: 1.5rem;
    }

    header.page-header h1 {
      margin: 0 0 0.5rem 0;
      color: var(--accent-glow);
      font-size: 1.9rem;
    }

    header.page-header p {
      margin: 0;
      color: var(--text-muted);
    }

    .controls-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 1rem;
      background-color: var(--bg-card);
      padding: 1rem 1.25rem;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    .controls-bar input {
      background-color: var(--bg-dark);
      color: var(--text-main);
      border: 1px solid var(--accent-purple);
      border-radius: 6px;
      padding: 0.5rem 0.9rem;
      font-size: 0.95rem;
      min-width: 260px;
    }

    .controls-bar input:focus {
      outline: none;
      box-shadow: 0 0 0 2px rgba(199, 125, 255, 0.35);
    }

    .table-wrapper {
      overflow-x: auto;
      background-color: var(--bg-card);
      border-radius: 10px;
      border: 1px solid var(--border-color);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    thead {
      background-color: var(--bg-header);
    }

    th {
      padding: 1rem;
      color: var(--accent-glow);
      font-weight: 600;
      border-bottom: 2px solid var(--accent-purple);
      white-space: nowrap;
    }

    td {
      padding: 1rem;
      border-bottom: 1px solid var(--border-color);
      vertical-align: top;
      font-size: 0.92rem;
    }

    tbody tr:hover {
      background-color: rgba(157, 78, 221, 0.1);
    }

    td.cms-name {
      font-weight: 700;
      font-size: 1.05rem;
      color: #ffffff;
      white-space: nowrap;
    }

    td ul {
      margin: 0;
      padding-left: 1.15rem;
    }

    td li {
      margin-bottom: 0.45rem;
    }

    td li:last-child {
      margin-bottom: 0;
    }

    a {
      color: var(--accent-glow);
      text-decoration: none;
      border-bottom: 1px dotted var(--accent-purple);
      transition: color 0.2s ease;
    }

    a:hover {
      color: #ffffff;
      border-bottom-style: solid;
    }

    .status-msg {
      padding: 1.5rem;
      text-align: center;
      color: var(--text-muted);
    }

    .error-msg {
      color: #ff758f;
      font-weight: 600;
    }

    .back-link {
      display: inline-block;
      margin-top: 1.5rem;
      padding: 0.6rem 1.2rem;
      background-color: var(--bg-header);
      border: 1px solid var(--accent-purple);
      border-radius: 6px;
      color: var(--text-main);
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="page-header">
      <h1>Web Content Management Systems (CMS) Comparison</h1>
      <p>COP4813 &mdash; Dynamic Client-Side Table Rendered from External JSON (<code>cms_data.json</code>)</p>
    </header>

    <div class="controls-bar">
      <div>
        <label for="cmsFilter"><strong>Filter Table:</strong> </label>
        <input type="text" id="cmsFilter" placeholder="Search CMS, PHP, Node.js, Open Source...">
      </div>
      <div id="recordCount" style="color: var(--text-muted); font-size: 0.9rem;">Loading systems...</div>
    </div>

    <div class="table-wrapper">
      <table id="cmsTable">
        <thead>
          <tr>
            <th>Name</th>
            <th>Support</th>
            <th>Technology</th>
            <th>Capabilities</th>
            <th>Limitations</th>
            <th>Examples</th>
          </tr>
        </thead>
        <tbody id="cmsTableBody">
          <tr>
            <td colspan="6" class="status-msg">Fetching CMS dataset...</td>
          </tr>
        </tbody>
      </table>
    </div>

    <a href="index.html" class="back-link">&larr; Back to Course Portfolio</a>
  </div>

  <script>
    let cmsDataset = [];

    function createLinkedListCell(items) {
      const td = document.createElement('td');
      const ul = document.createElement('ul');

      items.forEach(item => {
        const li = document.createElement('li');
        if (item.url) {
          const link = document.createElement('a');
          link.href = item.url;
          link.textContent = item.text;
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
          li.appendChild(link);
        } else {
          li.textContent = item.text;
        }
        ul.appendChild(li);
      });

      td.appendChild(ul);
      return td;
    }

    function renderTable(data) {
      const tbody = document.getElementById('cmsTableBody');
      const countLabel = document.getElementById('recordCount');
      tbody.innerHTML = '';

      if (data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="status-msg">No matching CMS platforms found.</td></tr>';
        countLabel.textContent = 'Showing 0 of ' + cmsDataset.length + ' systems';
        return;
      }

      data.forEach(cms => {
        const tr = document.createElement('tr');

        const nameTd = document.createElement('td');
        nameTd.className = 'cms-name';
        nameTd.textContent = cms.name;
        tr.appendChild(nameTd);

        tr.appendChild(createLinkedListCell(cms.support));
        tr.appendChild(createLinkedListCell(cms.technology));
        tr.appendChild(createLinkedListCell(cms.capabilities));
        tr.appendChild(createLinkedListCell(cms.limitations));
        tr.appendChild(createLinkedListCell(cms.examples));

        tbody.appendChild(tr);
      });

      countLabel.textContent = `Showing ${data.length} of ${cmsDataset.length} systems`;
    }

    async function loadCMSData() {
      const tbody = document.getElementById('cmsTableBody');
      try {
        const response = await fetch('./cms_data.json?v=' + Date.now());
        if (!response.ok) {
          throw new Error(`HTTP ${response.status} (${response.statusText}) fetching ${response.url}`);
        }
        cmsDataset = await response.json();
        renderTable(cmsDataset);
      } catch (error) {
        console.error('Error loading cms_data.json:', error);
        tbody.innerHTML = `
          <tr>
            <td colspan="6" class="status-msg error-msg">
              Failed to load cms_data.json: ${error.message}
            </td>
          </tr>`;
      }
    }

    document.getElementById('cmsFilter').addEventListener('input', function (e) {
      const query = e.target.value.toLowerCase().trim();
      const filtered = cmsDataset.filter(cms => {
        const searchableText = JSON.stringify(cms).toLowerCase();
        return searchableText.includes(query);
      });
      renderTable(filtered);
    });

    document.addEventListener('DOMContentLoaded', loadCMSData);
  </script>
</body>
</html>
